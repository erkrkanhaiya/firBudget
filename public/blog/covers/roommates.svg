<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Roommate expense tracker guide">
  <defs>
    <linearGradient id="room-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef5fc"/>
      <stop offset="100%" stop-color="#dceaf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#room-bg)"/>
  <rect x="620" y="80" width="320" height="260" rx="8" fill="#fff" stroke="#c8ddf0" stroke-width="2"/>
  <rect x="650" y="110" width="60" height="50" rx="4" fill="#438cd9" opacity="0.2"/>
  <rect x="730" y="110" width="60" height="50" rx="4" fill="#4db3eb" opacity="0.2"/>
  <rect x="810" y="110" width="60" height="50" rx="4" fill="#438cd9" opacity="0.2"/>
  <rect x="650" y="180" width="60" height="50" rx="4" fill="#4db3eb" opacity="0.2"/>
  <rect x="730" y="180" width="60" height="50" rx="4" fill="#438cd9" opacity="0.2"/>
  <rect x="810" y="180" width="60" height="50" rx="4" fill="#4db3eb" opacity="0.2"/>
  <rect x="700" y="260" width="80" height="80" rx="4" fill="#438cd9" opacity="0.15"/>
  <rect x="80" y="80" width="420" height="260" rx="16" fill="#fff" stroke="#c8ddf0" stroke-width="2"/>
  <text x="110" y="120" fill="#438cd9" font-family="system-ui,sans-serif" font-size="14" font-weight="700">SHARED EXPENSES</text>
  <text x="110" y="160" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Rent - Rs 18,000</text>
  <text x="110" y="195" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Electricity - Rs 1,240</text>
  <text x="110" y="230" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Wi-Fi - Rs 799</text>
  <text x="110" y="265" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Groceries - Rs 2,150</text>
  <line x1="110" y1="285" x2="470" y2="285" stroke="#e2e8f0" stroke-width="2"/>
  <text x="110" y="315" fill="#438cd9" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Per roommate: Rs 5,547</text>
  <text x="80" y="50" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">ROOMMATES</text>
  <text x="80" y="370" fill="#1e293b" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Track rent, utilities and groceries</text>
</svg>
