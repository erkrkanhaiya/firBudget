<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Equal vs custom expense split">
  <defs>
    <linearGradient id="equal-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef5fc"/>
      <stop offset="100%" stop-color="#dceaf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#equal-bg)"/>
  <rect x="80" y="70" width="480" height="260" rx="16" fill="#fff" stroke="#438cd9" stroke-width="2"/>
  <text x="110" y="110" fill="#438cd9" font-family="system-ui,sans-serif" font-size="14" font-weight="700">EQUAL SPLIT</text>
  <text x="320" y="170" text-anchor="middle" fill="#1e293b" font-family="system-ui,sans-serif" font-size="32" font-weight="800">Rs 900 / 3</text>
  <text x="320" y="210" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="20">= Rs 300 each</text>
  <rect x="640" y="70" width="480" height="260" rx="16" fill="#fff" stroke="#4db3eb" stroke-width="2"/>
  <text x="670" y="110" fill="#4db3eb" font-family="system-ui,sans-serif" font-size="14" font-weight="700">CUSTOM SPLIT</text>
  <text x="880" y="170" text-anchor="middle" fill="#1e293b" font-family="system-ui,sans-serif" font-size="32" font-weight="800">Rs 900 total</text>
  <text x="880" y="210" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="20">Rs 150 / 350 / 400</text>
  <text x="80" y="50" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">TIPS</text>
  <text x="80" y="370" fill="#1e293b" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Equal vs custom split - which to use?</text>
</svg>
