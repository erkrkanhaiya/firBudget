  <text x="210" y="307" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Split among 4</text>
  <text x="80" y="50" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">TRAVEL</text>
