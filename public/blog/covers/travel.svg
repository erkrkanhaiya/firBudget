<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Trip expense splitting guide">
  <defs>
    <linearGradient id="travel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5fc"/>
      <stop offset="100%" stop-color="#d6e8f8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#travel-bg)"/>
  <path d="M500 280 L620 120 L740 280 Z" fill="#438cd9" opacity="0.15"/>
  <path d="M620 280 L760 90 L900 280 Z" fill="#4db3eb" opacity="0.2"/>
  <line x1="0" y1="280" x2="1200" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="700" y="160" width="140" height="100" rx="12" fill="#438cd9"/>
  <rect x="750" y="140" width="40" height="24" rx="8" fill="none" stroke="#438cd9" stroke-width="6"/>
  <rect x="80" y="80" width="380" height="260" rx="16" fill="#fff" stroke="#c8ddf0" stroke-width="2"/>
  <text x="110" y="120" fill="#438cd9" font-family="system-ui,sans-serif" font-size="14" font-weight="700">TRIP EXPENSES</text>
