  <text x="110" y="230" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Food - $310</text>
  <text x="110" y="265" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Activities - $150</text>
