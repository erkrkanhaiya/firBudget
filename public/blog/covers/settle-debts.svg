<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Settle group debts without awkwardness">
  <defs>
    <linearGradient id="settle-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5fc"/>
      <stop offset="100%" stop-color="#d6e8f8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#settle-bg)"/>
  <rect x="80" y="80" width="420" height="260" rx="16" fill="#fff" stroke="#c8ddf0" stroke-width="2"/>
  <text x="110" y="120" fill="#438cd9" font-family="system-ui,sans-serif" font-size="14" font-weight="700">SIMPLIFIED BALANCES</text>
  <text x="110" y="165" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Alex pays Sam Rs 200</text>
  <text x="110" y="200" fill="#1e293b" font-family="system-ui,sans-serif" font-size="18">Sam pays Jordan Rs 150</text>
  <text x="110" y="235" fill="#64748b" font-family="system-ui,sans-serif" font-size="18">All settled</text>
  <rect x="110" y="280" width="200" height="36" rx="8" fill="#438cd9"/>
  <text x="210" y="304" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Record payment</text>
  <circle cx="800" cy="180" r="70" fill="#438cd9" opacity="0.1"/>
  <path d="M740 220 Q770 180 800 200 Q830 180 860 220" fill="none" stroke="#438cd9" stroke-width="8" stroke-linecap="round"/>
  <text x="800" y="280" text-anchor="middle" fill="#1e293b" font-family="system-ui,sans-serif" font-size="20" font-weight="600">No awkward IOUs</text>
  <text x="80" y="50" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">TIPS</text>
  <text x="80" y="370" fill="#1e293b" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Settle group debts with ease</text>
</svg>
