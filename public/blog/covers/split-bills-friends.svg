<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="How to split bills with friends fairly">
  <defs>
    <linearGradient id="split-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5fc"/>
      <stop offset="100%" stop-color="#d6e8f8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#split-bg)"/>
  <ellipse cx="680" cy="290" rx="280" ry="30" fill="#94a3b8" opacity="0.2"/>
  <rect x="400" y="200" width="560" height="16" rx="8" fill="#cbd5e1"/>
  <circle cx="520" cy="240" r="48" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="680" cy="240" r="48" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="840" cy="240" r="48" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="520" cy="230" r="18" fill="#fbbf24" opacity="0.8"/>
  <circle cx="680" cy="228" r="20" fill="#34d399" opacity="0.7"/>
  <circle cx="840" cy="232" r="16" fill="#f87171" opacity="0.7"/>
  <rect x="80" y="100" width="260" height="180" rx="16" fill="#fff" stroke="#c8ddf0" stroke-width="2"/>
  <text x="110" y="140" fill="#438cd9" font-family="system-ui,sans-serif" font-size="14" font-weight="700">TOTAL BILL</text>
  <text x="110" y="180" fill="#1e293b" font-family="system-ui,sans-serif" font-size="36" font-weight="800">Rs 1,200</text>
  <text x="110" y="210" fill="#64748b" font-family="system-ui,sans-serif" font-size="16">3 friends = Rs 400 each</text>
  <rect x="110" y="230" width="200" height="32" rx="8" fill="#438cd9"/>
  <text x="210" y="252" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Split equally</text>
  <text x="80" y="50" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">GUIDES</text>
  <text x="80" y="340" fill="#1e293b" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Split bills with friends fairly</text>
</svg>
